# azure-pipelines.yml
#
# Deploy to Wizardo from Azure DevOps.
# Add WIZARDO_TOKEN as a secret pipeline variable (not displayed, not
# checked in). Wizardo auto-detects Azure env vars for git SHA/branch.
#
# Requires: Pipeline variable WIZARDO_TOKEN (secret)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
          - script: npm ci
            displayName: Install deps
          - script: npm run build
            displayName: Build
          - publish: dist
            artifact: dist

  - stage: DeployStaging
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployStaging
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dist
                - script: >
                    npx -y @wizardo/cli@latest deploy $(Pipeline.Workspace)/dist
                    --remote "@myorg/dashboard"
                    --env staging
                  displayName: Deploy to staging
                  env:
                    WIZARDO_TOKEN: $(WIZARDO_TOKEN)

  - stage: DeployProduction
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dist
                - script: >
                    npx -y @wizardo/cli@latest deploy $(Pipeline.Workspace)/dist
                    --remote "@myorg/dashboard"
                    --env production
                  displayName: Deploy to production
                  env:
                    WIZARDO_TOKEN: $(WIZARDO_TOKEN)
