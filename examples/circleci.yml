# .circleci/config.yml
#
# Deploy to Wizardo from CircleCI.
# Set WIZARDO_TOKEN in Project Settings → Environment Variables.

version: "2.1"

jobs:
  build:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - restore_cache:
          keys: [v1-deps-{{ checksum "package-lock.json" }}]
      - run: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths: [node_modules]
      - run: npm run build
      - persist_to_workspace:
          root: .
          paths: [dist]

  deploy-staging:
    docker:
      - image: cimg/node:20.0
    steps:
      - attach_workspace: { at: . }
      - run:
          name: Deploy to Wizardo staging
          command: >
            npx -y @wizardo/cli@latest deploy ./dist
            --remote "@myorg/dashboard"
            --env staging

  deploy-production:
    docker:
      - image: cimg/node:20.0
    steps:
      - attach_workspace: { at: . }
      - run:
          name: Deploy to Wizardo production
          command: >
            npx -y @wizardo/cli@latest deploy ./dist
            --remote "@myorg/dashboard"
            --env production

workflows:
  deploy:
    jobs:
      - build
      - deploy-staging:
          requires: [build]
          filters:
            branches:
              only: main
      - approve-production:
          type: approval
          requires: [deploy-staging]
      - deploy-production:
          requires: [approve-production]
